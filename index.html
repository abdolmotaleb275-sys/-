html>
<html lang="bn">
<head><meta charset="UTF-8">
<style>
body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
#game-container { position: relative; width: 100vw; height: 100vh; }
#road { position: absolute; bottom: 0; width: 100%; height: 30%; background: #555; }
#rickshaw { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); width: 60px; height: 80px; background: #FF69B4; border-radius: 10px; }
.tree { position: absolute; bottom: 30%; width: 20px; height: 40px; background: #228B22; }
.obstacle { position: absolute; bottom: 30%; width: 40px; height: 40px; background: #FFD700; }
#ui { position: absolute; top: 10px; left: 10px; font-size: 20px; color: white; }
</style>
</head>
<body>
<div id="game-container">
<div id="ui">Score: <span id="score">0</span></div>
<div id="road"></div>
<div id="rickshaw"></div>
</div>
<script>
let score = 0;
const rickshaw = document.getElementById('rickshaw');
const scoreDisplay = document.getElementById('score');
let rickshawX = window.innerWidth / 2 - 30;
document.addEventListener('keydown', (e) => {
if (e.key === 'ArrowLeft' && rickshawX > 0) rickshawX -= 20;
if (e.key === 'ArrowRight' && rickshawX < window.innerWidth - 60) rickshawX += 20;
rickshaw.style.left = rickshawX + 'px';
});
function spawnObstacle() {
if (Math.random() < 0.02) {
const obs = document.createElement('div');
obs.className = 'obstacle';
obs.style.left = Math.random() * (window.innerWidth - 40) + 'px';
document.getElementById('game-container').appendChild(obs);
let obsPos = 30;
const moveObs = setInterval(() => {
obsPos += 5;
obs.style.bottom = obsPos + '%';
if (obsPos > 100) {
clearInterval(moveObs);
obs.remove();
score += 10;
scoreDisplay.innerText = score;
}
}, 50);
}
requestAnimationFrame(spawnObstacle);
}
spawnObstacle();
</script>
</body>
</html>
