<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bangladesh TukTuk Driver</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#10251d;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}
#wrap{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto;background:#173b2b}
header{padding:9px 12px;display:flex;justify-content:space-between;align-items:center;background:#0b2118;font-weight:700}
.stats{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
#game{display:block;width:100%;flex:1;min-height:0;background:#78b96a}
#message{min-height:30px;text-align:center;padding:5px;font-size:13px;background:#143324}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#0b2118}
button{border:0;border-radius:14px;padding:13px 8px;background:#2ebc69;color:#052313;font-weight:800;font-size:15px;box-shadow:0 3px 0 #147b42;touch-action:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #147b42}
button.secondary{background:#e4c64d;box-shadow:0 3px 0 #9d8122}
button.horn{background:#61c9ed;box-shadow:0 3px 0 #2784a5}
button:disabled{opacity:.5}
.small{font-size:11px;font-weight:500;display:block}
#overlay{position:fixed;inset:0;background:#06150edb;display:flex;align-items:center;justify-content:center;padding:22px}
.panel{max-width:360px;background:#173b2b;border:2px solid #44d47b;border-radius:20px;padding:22px;text-align:center}
.panel h1{margin:0 0 8px;font-size:25px}.panel p{line-height:1.5;color:#d7f3df}
.panel button{width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="wrap">
<header><div>🛺 বাংলাদেশ টুকটুক ড্রাইভার</div><div class="stats"><span>💰 ৳<b id="money">0</b></span><span>⛽ <b id="fuel">100</b>%</span><span>👤 <b id="pax">0</b>/3</span></div></header>
<canvas id="game"></canvas>
<div id="message">যাত্রী তুলতে স্টপেজের কাছে থামো। পাম্পে গিয়ে জ্বালানি নাও!</div>
<div class="controls">
<button id="left">⬅️ বাম<span class="small">Left</span></button>
<button id="drive">🚦 চালাও<span class="small">চেপে ধরে রাখো</span></button>
<button id="right">ডান ➡️<span class="small">Right</span></button>
<button id="horn" class="horn">📢 হর্ন</button>
<button id="brake" class="secondary">🛑 ব্রেক</button>
<button id="refuel" class="secondary">⛽ তেল নাও<span class="small">পাম্পের কাছে</span></button>
</div>
</div>
<div id="overlay"><div class="panel"><h1>🛺 TukTuk Driver</h1><p>বাংলাদেশের রাস্তায় অটো চালাও, যাত্রী তোলো এবং গন্তব্যে পৌঁছে ভাড়া আয় করো। পেট্রোল পাম্পে গিয়ে তেল ভরো!</p><button id="start">গেম শুরু করো ▶</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=360,H=600, dpr=1, player={x:180,y:470}, fuel=100,money=0,pax=0,speed=0,roadOffset=0,started=false,gameOver=false;
let left=false,right=false,drive=false,brake=false, hornFlash=0;
let stopY=150, pumpY=-500, last=0, distance=0;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=Math.min(Math.max(player.x, W*.28),W*.72)}
window.addEventListener('resize',resize);resize();
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawAuto(x,y){ // stylized green tuk-tuk
  // shadow
  rounded(x-22,y-18,44,54,10,'#294331');
  // rear passenger cabin
  rounded(x-24,y-23,48,35,9,'#148b4a');
  rounded(x-19,y-19,38,22,5,'#9ce5bc');
  ctx.fillStyle='#145c39';ctx.fillRect(x-16,y-16,32,3);
  // front hood
  rounded(x-17,y+9,34,24,7,'#22b95e');
  rounded(x-12,y+13,24,11,4,'#d7f4df');
  // roof
  rounded(x-26,y-28,52,8,4,'#08783c');
  // wheels
  rounded(x-28,y-7,7,19,3,'#17221c');rounded(x+21,y-7,7,19,3,'#17221c');
  rounded(x-21,y+24,8,14,3,'#17221c');rounded(x+13,y+24,8,14,3,'#17221c');
  // driver
  ctx.fillStyle='#f2c39b';ctx.beginPath();ctx.arc(x,y+2,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#243c9a';ctx.fillRect(x-6,y+7,12,7);
  ctx.fillStyle='#fff2a6';ctx.fillRect(x-12,y+29,7,3);ctx.fillRect(x+5,y+29,7,3);
}
function drawRoad(){
 ctx.fillStyle='#78b96a';ctx.fillRect(0,0,W,H);
 // trees and roadside houses
 for(let i=-1;i<8;i++){let y=((i*110+roadOffset*.55)% (H+110)+H+110)%(H+110)-50;
  ctx.fillStyle='#277b43';ctx.beginPath();ctx.arc(25,y,13,0,7);ctx.fill();ctx.beginPath();ctx.arc(W-25,y+35,14,0,7);ctx.fill();
  if(i%2===0){rounded(3,y+30,37,28,3,'#d9a45f');ctx.fillStyle='#a44735';ctx.beginPath();ctx.moveTo(0,y+30);ctx.lineTo(21,y+14);ctx.lineTo(43,y+30);ctx.fill();rounded(W-43,y+2,40,30,3,'#e5d18a');ctx.fillStyle='#a44735';ctx.beginPath();ctx.moveTo(W-47,y+2);ctx.lineTo(W-23,y-12);ctx.lineTo(W,y+2);ctx.fill();}
 }
 ctx.fillStyle='#555b5b';ctx.fillRect(W*.22,0,W*.56,H);
 ctx.fillStyle='#e7dfb9';ctx.fillRect(W*.22-3,0,3,H);ctx.fillRect(W*.78,0,3,H);
 ctx.strokeStyle='#f6e9a8';ctx.lineWidth=3;ctx.setLineDash([25,23]);ctx.lineDashOffset=-roadOffset;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
}
function drawStop(y){rounded(W*.06,y-24, W*.14,48,5,'#f3df8a');ctx.fillStyle='#543d20';ctx.font='bold 10px sans-serif';ctx.fillText('STOP',W*.075,y+3);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W*.15,y-34,8,0,7);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(W*.147,y-26,6,20);ctx.fillStyle='#ffd0a0';ctx.beginPath();ctx.arc(W*.15,y-48,7,0,7);ctx.fill();ctx.fillStyle='#225';ctx.fillRect(W*.14,y-41,12,13)}
function drawPump(y){rounded(W*.81,y-32,W*.17,64,6,'#f5e8c8');ctx.fillStyle='#d43d32';ctx.font='bold 10px sans-serif';ctx.fillText('PETROL',W*.82,y-12);ctx.fillText('PUMP',W*.835,y+1);rounded(W*.85,y+7,18,17,3,'#e34b3b')}
function draw(){
 drawRoad();
 // roadside objects
 drawStop(stopY);drawPump(pumpY);
 // passengers shown inside rear cabin
 if(pax>0){ctx.fillStyle='#f4c59b';for(let i=0;i<pax;i++){ctx.beginPath();ctx.arc(player.x-12+i*12,player.y-12,4,0,7);ctx.fill()}}
 drawAuto(player.x,player.y);
 if(hornFlash>0){ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.fillText('PON! 📢',player.x-32,player.y-48);hornFlash--}
}
function say(s){$('message').textContent=s}
function update(dt){
 if(!started||gameOver)return;
 let moving=drive&&!brake&&fuel>0;
 speed=moving?155:0;
 if(brake)speed=0;
 if(left)player.x-=145*dt;if(right)player.x+=145*dt;
 player.x=Math.max(W*.27,Math.min(W*.73,player.x));
 if(moving){roadOffset+=speed*dt;distance+=speed*dt;fuel=Math.max(0,fuel-0.9*dt);stopY+=speed*dt;pumpY+=speed*dt;}
 else {stopY+=speed*dt;pumpY+=speed*dt;}
 if(stopY>H+50){stopY=-150-Math.random()*180;}
 if(pumpY>H+80){pumpY=-700-Math.random()*500;}
 // pickup/dropoff and pump proximity
 if(Math.abs(stopY-player.y)<38 && Math.abs(player.x-W*.15)<W*.2){
   if(pax<3){pax++;$('pax').textContent=pax;say('যাত্রী উঠেছে! গন্তব্যে পৌঁছাতে সামনে চালাও।');stopY=-500;}
 }
 if(distance>700){distance=0;if(pax>0){money+=50*pax;pax=0;$('money').textContent=money;$('pax').textContent=pax;say('গন্তব্যে পৌঁছেছ! ভাড়া পেয়েছ ৳'+50*3+'।');}}
 if(fuel<=0){say('জ্বালানি শেষ! পাম্পে যেতে রিফুয়েল বোতাম চাপো।');}
 $('fuel').textContent=Math.round(fuel);
}
function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function bindHold(id,fn){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>fn(false)))}
bindHold('left',v=>left=v);bindHold('right',v=>right=v);bindHold('drive',v=>drive=v);bindHold('brake',v=>brake=v);
$('horn').onclick=()=>{hornFlash=25;say('পোঁ পোঁ! হর্ন বাজছে!')};
$('refuel').onclick=()=>{if(Math.abs(pumpY-player.y)<95 && player.x>W*.58){fuel=100;$('fuel').textContent=100;say('ট্যাংক ভর্তি! আবার চালাতে পারো।')}else say('তেল নিতে পেট্রোল পাম্পের একদম কাছে যাও।')};
$('start').onclick=()=>{$('overlay').style.display='none';started=true;say('চালাও বাটন চেপে ধরে অটো চালাও। স্টপেজে গিয়ে যাত্রী তোলো!')};
</script>
</body></html>
