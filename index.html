<!DOCTYPE html>
<html><head>
    <style>
        body { margin: 0; text-align: center; background: #333; }
        canvas { background: #87CEEB; display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let rickshaw = { x: 180, y: 500, width: 40, height: 70, speed: 20 };
        let obstacles = [];
        let score = 0;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" && rickshaw.x > 0) rickshaw.x -= rickshaw.speed;
            if (e.key === "ArrowRight" && rickshaw.x < canvas.width - rickshaw.width) rickshaw.x += rickshaw.speed;
        });

        function update() {
            if (Math.random() < 0.05) {
                obstacles.push({ x: Math.random() * (canvas.width - 30), y: 0, width: 30, height: 30 });
            }
            obstacles.forEach((obs, index) => {
                obs.y += 5;
                if (obs.y > canvas.height) {
                    obstacles.splice(index, 1);
                    score += 10;
                }
                if (obs.x < rickshaw.x + rickshaw.width &&
                    obs.x + obs.width > rickshaw.x &&
                    obs.y < rickshaw.y + rickshaw.height &&
                    obs.y + obs.height > rickshaw.y) {
                    alert("Game Over! Score: " + score);
                    obstacles = [];
                    score = 0;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw Rickshaw
            ctx.fillStyle = "#FF69B4";
            ctx.fillRect(rickshaw.x, rickshaw.y, rickshaw.width, rickshaw.height);
            // Draw Obstacles
            ctx.fillStyle = "#FFD700";
            obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.width, obs.height));
            // Draw Score
            ctx.fillStyle = "#000";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 10, 20);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
