<style>

body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none}

#bf{display:block;height:100%;width:100%;background:#3ddc84}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;font-size:22px;gap:8px;text-align:center}
.row{display:flex;gap:8px;width:100%;max-width:420px}
button{flex:1;font-size:24px;padding:14px 0;border:0;border-radius:12px;background:var(--btn);color:#fff;touch-action:none}
#H{background:#6a1b9a}#B{background:#c62828}#S{background:#e08a00}
</style>
